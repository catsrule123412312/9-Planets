name: Build 9 Planets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      
      # THE MAGIC TRICK: Creates a tiny script to fix the asset paths automatically
      - name: Create runtime hook
        run: echo "import sys, os; os.chdir(sys._MEIPASS)" > hook.py
        
      - name: Build with PyInstaller
        # --onefile makes it a single file. --runtime-hook fixes the assets. --icon adds your logo.
        run: pyinstaller --onefile --runtime-hook=hook.py --name "9Planets" --add-data "assets;assets" --icon="logo.ico" 9_planets.py
        
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Windows
          path: dist/9Planets.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      
      - name: Create runtime hook
        run: echo "import sys, os; os.chdir(sys._MEIPASS)" > hook.py
        
      - name: Build with PyInstaller
        run: pyinstaller --onefile --runtime-hook=hook.py --name "9Planets" --add-data "assets:assets" --icon="logo.icns" 9_planets.py
        
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Mac
          path: dist/9Planets

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      
      - name: Create runtime hook
        run: echo "import sys, os; os.chdir(sys._MEIPASS)" > hook.py
        
      - name: Build with PyInstaller
        # Linux doesn't support embedded icons, so we leave --icon out
        run: pyinstaller --onefile --runtime-hook=hook.py --name "9Planets" --add-data "assets:assets" 9_planets.py
        
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Linux
          path: dist/9Planets
