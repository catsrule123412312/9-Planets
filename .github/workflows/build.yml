name: Build 9 Planets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pygame
      - name: Build with PyInstaller
        # Note the colon (:) for Mac/Linux
        run: pyinstaller --onefile --name "9Planets" --add-data "assets:assets" 9_planets.py
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-macOS
          path: dist/9Planets

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pygame
      - name: Build with PyInstaller
        # Note the colon (:) for Mac/Linux
        run: pyinstaller --onefile --name "9Planets" --add-data "assets:assets" 9_planets.py
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Linux
          path: dist/9Planets

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pygame
      - name: Build with PyInstaller
        # Note the semicolon (;) for Windows
        run: pyinstaller --onefile --name "9Planets" --add-data "assets;assets" 9_planets.py
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Windows
          path: dist/9Planets.exe
