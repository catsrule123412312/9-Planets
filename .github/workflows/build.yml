name: Build 9 Planets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      
      - name: Create runtime hook
        run: echo "import sys, os; os.chdir(sys._MEIPASS)" > hook.py
        
      - name: Build game with PyInstaller
        run: pyinstaller --onefile --runtime-hook=hook.py --name "9Planets" --add-data "9 Planets Beta;9 Planets Beta" --icon="logo.ico" 9_planets.py
        
      - name: Build launcher with PyInstaller
        # This creates a launcher.exe that works on Windows
        run: pyinstaller --onefile --name "Launch 9 Planets" --icon="logo.ico" launcher.py
        
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Windows
          path: |
            dist/9Planets.exe
            dist/Launch 9 Planets.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      
      - name: Create runtime hook
        run: echo "import sys, os; os.chdir(sys._MEIPASS)" > hook.py
        
      - name: Build game with PyInstaller
        run: pyinstaller --onefile --windowed --runtime-hook=hook.py --name "9Planets" --add-data "9 Planets Beta:9 Planets Beta" --icon="logo.icns" 9_planets.py
        
      - name: Build launcher with PyInstaller
        run: pyinstaller --onefile --name "Launch 9 Planets" --icon="logo.icns" launcher.py
        
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Mac
          path: |
            dist/9Planets
            dist/Launch 9 Planets

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      
      - name: Create runtime hook
        run: echo "import sys, os; os.chdir(sys._MEIPASS)" > hook.py
        
      - name: Build game with PyInstaller
        run: pyinstaller --onefile --runtime-hook=hook.py --name "9Planets" --add-data "9 Planets Beta:9 Planets Beta" 9_planets.py
        
      - name: Build launcher with PyInstaller
        run: pyinstaller --onefile --name "Launch 9 Planets" launcher.py
        
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Linux
          path: |
            dist/9Planets
            dist/Launch 9 Planets
