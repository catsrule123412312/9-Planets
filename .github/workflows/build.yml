name: Build 9 Planets

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Build Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      # Notice we named it 9Planets-Windows so it doesn't clash
      - run: pyinstaller --onefile --name "9Planets-Windows" --add-data "assets;assets" 9_planets.py
      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: dist/9Planets-Windows.exe

  # 2. Build Mac
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      # Notice we named it 9Planets-Mac (No .exe for Mac!)
      - run: pyinstaller --onefile --name "9Planets-Mac" --add-data "assets:assets" 9_planets.py
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/9Planets-Mac

  # 3. Build Linux
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pygame
      # Notice we named it 9Planets-Linux (No .exe for Linux!)
      - run: pyinstaller --onefile --name "9Planets-Linux" --add-data "assets:assets" 9_planets.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/9Planets-Linux

  # 4. The Final Step: Gather everything and publish to the Release page safely
  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built files
        uses: actions/download-artifact@v4
        with:
          path: final-builds
          merge-multiple: true
          
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # This grabs the .exe, the Mac file, and the Linux file all at once!
          files: final-builds/*
          name: "Latest Build"
          tag_name: "latest"
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
