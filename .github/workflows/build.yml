name: Build 9 Planets

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # The "Run workflow" button

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pygame
      - name: Build with PyInstaller
        # CHANGED to --onedir. Windows uses semicolon (;)
        run: pyinstaller --onedir --name "9Planets-Windows" --add-data "assets;assets" 9_planets.py
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Windows
          # This uploads the ENTIRE folder, not just the .exe
          path: dist/9Planets-Windows/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pygame
      - name: Build with PyInstaller
        # CHANGED to --onedir. Mac uses colon (:)
        run: pyinstaller --onedir --name "9Planets-Mac" --add-data "assets:assets" 9_planets.py
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Mac
          path: dist/9Planets-Mac/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pygame
      - name: Build with PyInstaller
        # CHANGED to --onedir. Linux uses colon (:)
        run: pyinstaller --onedir --name "9Planets-Linux" --add-data "assets:assets" 9_planets.py
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: 9Planets-Linux
          path: dist/9Planets-Linux/
